<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap"><h1 id="sn"></h1><input id="q" type="search" placeholder="Cari produk" aria-label="Cari produk" style="max-width:220px"></div></header>
<div class="banner-wrap" id="bannerWrap" hidden>
  <div class="banner-track" id="bannerTrack"></div>
  <div class="banner-dots" id="bannerDots"></div>
</div>
<div class="wrap"><div class="chips" id="ch"></div><div class="grid2" id="g"></div></div>
<footer id="ft"></footer>

<button class="fab" id="fab" hidden onclick="openCart()">🛒 <span class="cnt" id="fabCnt">0</span> <span id="fabTot"></span></button>

<dialog id="dl"></dialog>
<dialog id="cartDl"></dialog>
<dialog id="addrDl"></dialog>
<dialog id="congratsDl"></dialog>
<div id="toast2" role="status"></div>

<script src="config.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s);
let P=[],B=[],PR=[],cat='',promoFilter=null;
let appliedPromoIds=new Set();
let cart=JSON.parse(localStorage.getItem('cart_v1')||'[]');   // [{id,qty}]
let addr=JSON.parse(localStorage.getItem('addr_v1')||'null');
let pendingItems=null, pendingIsCart=false, curId=null;

const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const find=id=>P.find(p=>p.id==id);
document.title=C.storeName;$('#sn').textContent=C.storeName;
$('#ft').textContent=`© ${new Date().getFullYear()} ${C.storeName}`;

function toast(m){const t=$('#toast2');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}

/* ---------- promo pintar ---------- */
function promoLabel(pr){
  const name=id=>find(id)?.name||'?';
  if(pr.type==='bxgy_self')return `Beli ${pr.buy} ${name(pr.productId)} Gratis ${pr.free}`;
  if(pr.type==='bxgy_cross')return `Beli ${pr.aQty} ${name(pr.a)} Gratis ${pr.bQty} ${name(pr.b)}`;
  if(pr.type==='bundle')return `Beli ${pr.aQty} ${name(pr.a)} + ${pr.bQty} ${name(pr.b)} Hemat ${rp(pr.discount)}`;
  return '';
}
function promosForProduct(id){return PR.filter(pr=>pr.active!==false&&(pr.productId==id||pr.a==id||pr.b==id))}
function qtyOf(items,id){return items.find(x=>x.id==id)?.qty||0}

/* Hitung diskon & bonus gratis dari SEMUA promo aktif untuk isi keranjang saat ini — satu-satunya sumber
   perhitungan, dipakai baik untuk tampilan keranjang maupun pesan WhatsApp, supaya angkanya selalu sama. */
function evaluateCart(items){
  let discount=0;const freebies=[],applied=[];
  for(const pr of PR){
    if(pr.active===false)continue;
    if(pr.type==='bxgy_self'){
      const groupSize=pr.buy+pr.free;if(groupSize<=0)continue;
      const q=qtyOf(items,pr.productId);const groups=Math.floor(q/groupSize);
      if(groups>0){
        const p=find(pr.productId);const amt=groups*pr.free*(p?.price||0);
        discount+=amt;applied.push({id:pr.id,text:`${promoLabel(pr)} — hemat ${rp(amt)}`});
      }
    }else if(pr.type==='bxgy_cross'){
      const qa=qtyOf(items,pr.a);
      if(qa>=pr.aQty){
        const sets=Math.floor(qa/pr.aQty),freeQty=sets*pr.bQty,pb=find(pr.b);
        const amt=freeQty*(pb?.price||0);
        discount+=amt;freebies.push({id:pr.b,name:pb?.name||'?',qty:freeQty});
        applied.push({id:pr.id,text:`${promoLabel(pr)} — hemat ${rp(amt)}`});
      }
    }else if(pr.type==='bundle'){
      const qa=qtyOf(items,pr.a),qb=qtyOf(items,pr.b);
      const sets=Math.min(Math.floor(qa/pr.aQty),Math.floor(qb/pr.bQty));
      if(sets>0){
        const amt=sets*pr.discount;
        discount+=amt;applied.push({id:pr.id,text:`${promoLabel(pr)} x${sets} — hemat ${rp(amt)}`});
      }
    }
  }
  return {discount,freebies,applied};
}
/* Cari promo yang HAMPIR terpenuhi, untuk saran ke pembeli (mis. "tambah 1 lagi untuk gratis") */
function nearMissText(items){
  for(const pr of PR){
    if(pr.active===false)continue;
    if(pr.type==='bxgy_self'){
      const p=find(pr.productId);if(!p)continue;
      const groupSize=pr.buy+pr.free,q=qtyOf(items,pr.productId);
      if(q>0&&q%groupSize!==0&&q<groupSize*50){const need=groupSize-(q%groupSize);if(need>0&&need<=groupSize-1)return `Tambah ${need} ${p.name} lagi untuk dapat gratis ${pr.free}!`}
    }else if(pr.type==='bxgy_cross'){
      const pa=find(pr.a),pb=find(pr.b);if(!pa||!pb)continue;
      const qa=qtyOf(items,pr.a);
      if(qa>0&&qa<pr.aQty)return `Tambah ${pr.aQty-qa} ${pa.name} lagi, dapat gratis ${pr.bQty} ${pb.name}!`;
    }else if(pr.type==='bundle'){
      const pa=find(pr.a),pb=find(pr.b);if(!pa||!pb)continue;
      const qa=qtyOf(items,pr.a),qb=qtyOf(items,pr.b);
      if(qa>=pr.aQty&&qb<pr.bQty)return `Tambah ${pr.bQty-qb} ${pb.name} lagi, dapat potongan ${rp(pr.discount)}!`;
      if(qb>=pr.bQty&&qa<pr.aQty)return `Tambah ${pr.aQty-qa} ${pa.name} lagi, dapat potongan ${rp(pr.discount)}!`;
    }
  }
  return null;
}
function showCongrats(text){
  $('#congratsDl').innerHTML=`<button class="dclose" onclick="congratsDl.close()">✕</button>
    <div class="dbody" style="text-align:center;padding-top:30px">
      <div style="font-size:2.6rem;line-height:1">🎉</div>
      <h2 style="margin:12px 0 6px">Selamat!</h2>
      <p>${text}</p>
      <button style="margin-top:16px" onclick="congratsDl.close()">Asyik, lanjut belanja</button>
    </div>`;
  $('#congratsDl').showModal();
}
/* Dipanggil tiap isi keranjang berubah: munculkan popup selamat kalau promo baru saja terpenuhi,
   atau saran kalau pembeli hampir memenuhi syarat promo. */
function checkPromoFeedback(){
  const res=evaluateCart(cart);
  const newIds=new Set(res.applied.map(a=>a.id));
  const newlySatisfied=res.applied.filter(a=>!appliedPromoIds.has(a.id));
  appliedPromoIds=newIds;
  if(newlySatisfied.length){
    showCongrats(newlySatisfied.map(a=>esc(a.text.split(' — ')[0])).join('<br>'));
  }else{
    const nm=nearMissText(cart);
    if(nm)toast(nm);
  }
}

/* ---------- grid ---------- */
function isHabis(p){return p.status=='habis'||(p.stock??0)<=0}
function draw(){
  const q=$('#q').value.toLowerCase(),cs=[...new Set(P.map(p=>p.category).filter(Boolean))];
  $('#ch').innerHTML= promoFilter
    ? `<button class="on" id="clearPromo">✕ Promo: menampilkan ${promoFilter.ids.length} produk</button>`
    : (cs.length?['',...cs].map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${c?esc(c):'Semua'}</button>`).join(''):'');
  const base= promoFilter ? P.filter(p=>promoFilter.ids.includes(p.id)) : P.filter(p=>!cat||p.category===cat);
  const L=base.filter(p=>p.name.toLowerCase().includes(q));
  $('#g').innerHTML=L.length?L.map(p=>{
    const habis=isHabis(p),prs=promosForProduct(p.id),promo=prs.length?promoLabel(prs[0]):'',coret=p.originalPrice>p.price;
    return `
    <div class="card">
      <button class="imgb" data-more="${esc(p.id)}">${p.image?`<img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name)}">`:'<span class="ph"></span>'}${promo?`<span class="promo-ribbon">${esc(promo)}</span>`:''}</button>
      <div class="info">
        <b>${esc(p.name)}</b>
        ${coret?`<span class="strike">${rp(p.originalPrice)}</span>`:''}
        <span class="price">${rp(p.price)}</span>
        ${habis?'<span class="badge">Stok habis</span>':''}
        <div class="card-actions">
          <button class="b-more" data-more="${esc(p.id)}">Selengkapnya</button>
          <button class="b-cart" data-add="${esc(p.id)}" ${habis?'disabled':''} aria-label="Tambah ke keranjang"><img src="aset/keranjang.png" alt=""></button>
        </div>
      </div>
    </div>`;
  }).join(''):'<p class="mut" style="grid-column:1/-1">Tidak ada produk yang cocok.</p>';
}
$('#ch').onclick=e=>{
  if(e.target.id=='clearPromo'){promoFilter=null;draw();return}
  if(e.target.dataset.c!==undefined){cat=e.target.dataset.c;draw()}
};
$('#q').oninput=draw;
$('#g').onclick=e=>{
  const m=e.target.closest('[data-more]'),a=e.target.closest('[data-add]');
  if(m)openDetail(m.dataset.more);
  if(a){addToCart(a.dataset.add,1);toast('Ditambahkan ke keranjang')}
};

/* ---------- detail dialog ---------- */
function openDetail(id){
  curId=id;const p=find(id);if(!p)return;
  const habis=isHabis(p),prs=promosForProduct(p.id),coret=p.originalPrice>p.price;
  $('#dl').innerHTML=`<button class="dclose" onclick="dl.close()">✕</button>
    <div class="det">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<span class="ph"></span>'}
    <div>
      <h2>${esc(p.name)}</h2>
      <p class="mut">${esc(p.category||'')}</p>
      ${prs.length?`<div>${prs.map(pr=>`<span class="promo-badge">${esc(promoLabel(pr))}</span>`).join(' ')}</div>`:''}
      <p>${coret?`<span class="strike">${rp(p.originalPrice)}</span> `:''}<b>${rp(p.price)}</b> ${habis?'<span class="badge">· Stok habis</span>':''}</p>
      <p>${esc(p.desc)}</p>
      <div class="qty"><span>Jumlah</span><button type="button" onclick="stepQty(-1)">−</button><input id="mqty" type="number" min="1" max="${p.stock||99}" value="1"><button type="button" onclick="stepQty(1)">+</button></div>
      <button data-cart="${esc(p.id)}" ${habis?'disabled':''}>Tambah ke Keranjang</button>
      <button class="ghost" data-buy="${esc(p.id)}" ${habis?'disabled':''}>Beli Langsung</button>
    </div></div>`;
  $('#dl').showModal();
}
function stepQty(d){const i=$('#mqty');const max=+i.max||99;i.value=Math.min(max,Math.max(1,(+i.value||1)+d))}
$('#dl').onclick=e=>{
  if(e.target.id=='dl')e.target.close();
  const c=e.target.closest('[data-cart]'),b=e.target.closest('[data-buy]');
  const qty=Math.max(1,+$('#mqty')?.value||1);
  if(c){addToCart(c.dataset.cart,qty);toast('Ditambahkan ke keranjang');$('#dl').close()}
  if(b){addToCart(b.dataset.buy,qty);$('#dl').close();openCart()}
};

/* ---------- cart ---------- */
function saveCart(){localStorage.setItem('cart_v1',JSON.stringify(cart))}
function cartCount(){return cart.reduce((s,x)=>s+x.qty,0)}
function cartTotal(items){return (items||cart).reduce((s,x)=>{const p=find(x.id);return s+(p?p.price*x.qty:0)},0)}
function addToCart(id,qty){
  const p=find(id);const max=p?.stock??Infinity;
  const e=cart.find(x=>x.id==id);
  const current=e?e.qty:0,wanted=current+qty,applied=Math.min(max,wanted);
  if(e)e.qty=applied;else if(applied>0)cart.push({id,qty:applied});
  if(wanted>max)toast(`Stok tersisa ${max}, jumlah di keranjang disesuaikan.`);
  saveCart();updateFab();checkPromoFeedback();
}
function changeQty(id,d){const e=cart.find(x=>x.id==id);if(!e)return;const p=find(id);const max=p?.stock??Infinity;e.qty=Math.min(max,e.qty+d);if(e.qty<=0)cart=cart.filter(x=>x.id!=id);saveCart();updateFab();renderCart();checkPromoFeedback()}
function removeItem(id){cart=cart.filter(x=>x.id!=id);saveCart();updateFab();renderCart();checkPromoFeedback()}
function updateFab(){const n=cartCount();$('#fab').hidden=n==0;$('#fabCnt').textContent=n;const t=Math.max(0,cartTotal()-evaluateCart(cart).discount);$('#fabTot').textContent=n?rp(t):''}
function openCart(){renderCart();$('#cartDl').showModal()}
function renderCart(){
  const rows=cart.map(x=>{const p=find(x.id);if(!p)return'';return `
    <div class="crow">${p.image?`<img src="${esc(p.image)}">`:'<span class="ph"></span>'}
      <div><b>${esc(p.name)}</b><span class="mut">${rp(p.price)}</span></div>
      <div class="qty"><button onclick="changeQty('${esc(x.id)}',-1)">−</button><span>${x.qty}</span><button onclick="changeQty('${esc(x.id)}',1)">+</button></div>
      <button class="bad" style="border:0;background:none;padding:6px" onclick="removeItem('${esc(x.id)}')">✕</button>
    </div>`}).join('');
  const addrHtml=addr?`<div class="addr-sum"><b>${esc(addr.nama)}</b> · ${esc(addr.telp)}<br>${esc(addr.detail)}<br>${esc(addr.destLabel||'')} ${esc(addr.pos||'')}</div><button class="ghost" onclick="openAddress()">Ubah alamat</button>`
    :`<button onclick="openAddress()">+ Tambah Alamat Pengiriman</button>`;
  const ev=evaluateCart(cart),subtotal=cartTotal(),grand=Math.max(0,subtotal-ev.discount);
  const nm=cart.length?nearMissText(cart):null;
  $('#cartDl').innerHTML=`<button class="dclose" onclick="cartDl.close()">✕</button>
    <div class="dtitle">Keranjang</div>
    <div class="dbody">
      ${cart.length?rows:'<p class="mut">Keranjang masih kosong.</p>'}
      ${cart.length?`<div class="subrow"><span>Subtotal</span><span>${rp(subtotal)}</span></div>`:''}
      ${ev.applied.length?`<div class="promo-applied">${ev.applied.map(a=>`<div class="promo-line">🏷️ ${esc(a.text)}</div>`).join('')}</div>`:''}
      ${ev.freebies.length?`<div class="promo-line">🎁 Bonus gratis: ${ev.freebies.map(f=>`${f.qty}x ${esc(f.name)}`).join(', ')}</div>`:''}
      ${nm?`<div class="promo-line promo-suggest">💡 ${esc(nm)}</div>`:''}
      ${ev.discount>0?`<div class="subrow" style="color:var(--green-dark)"><span>Potongan promo</span><span>-${rp(ev.discount)}</span></div>`:''}
      ${cart.length?`<div class="subrow" style="color:var(--red)"><span>Total</span><span>${rp(grand)}</span></div><p class="note">Harga belum termasuk ongkos kirim. Ongkir akan diinfokan admin setelah alamat dicek.</p>`:''}
      <h3 style="margin-top:6px">Alamat pengiriman</h3>${addrHtml}
      ${cart.length?`<button id="ckBtn" style="margin-top:14px;width:100%">Checkout via WhatsApp</button>`:''}
    </div>`;
  $('#ckBtn')?.addEventListener('click',()=>startCheckout(cart.slice(),true));
}

/* ---------- address ---------- */
function openAddress(){
  $('#addrDl').innerHTML=`<button class="dclose" onclick="addrDl.close()">✕</button>
    <div class="dtitle">Alamat pengiriman</div>
    <div class="dbody">
      <button type="button" id="geoBtn" class="ghost" style="width:100%">📍 Deteksi lokasi saya (otomatis)</button>
      <p class="mut" id="geoMsg" style="min-height:1.2em"></p>
      <form class="addr" id="af">
        <label>Nama penerima<input id="a_nama" required value="${esc(addr?.nama||'')}"></label>
        <label>No. WhatsApp<input id="a_telp" required inputmode="tel" value="${esc(addr?.telp||'')}"></label>
        <label>Cari wilayah tujuan (untuk hitung ongkir otomatis)<input id="a_search" placeholder="Contoh: nama kelurahan/kecamatan" autocomplete="off"></label>
        <div id="a_sugg" class="sugg-list"></div>
        <div id="a_picked" class="addr-sum" ${addr?.destId?'':'hidden'}>${addr?.destId?esc(addr.destLabel):''}</div>
        <label>Alamat lengkap (jalan, no. rumah, RT/RW, patokan)<textarea id="a_detail" rows="3" required>${esc(addr?.detail||'')}</textarea></label>
        <label>Kode pos<input id="a_pos" value="${esc(addr?.pos||'')}"></label>
        <button type="submit">Simpan alamat</button>
      </form>
    </div>`;
  $('#addrDl').showModal();
  let picked=addr?.destId?{id:addr.destId,label:addr.destLabel}:null;
  let searchDebounce;
  async function runSearch(q){
    if(q.length<3){$('#a_sugg').innerHTML='';return}
    $('#a_sugg').innerHTML='<p class="mut">Mencari…</p>';
    try{
      const r=await fetch('/api/ongkir?q='+encodeURIComponent(q));
      const j=await r.json();
      if(!r.ok)throw new Error(j.error||'Gagal mencari wilayah');
      const list=j.data||[];
      $('#a_sugg').innerHTML=list.length?list.map(d=>`<button type="button" class="sugg-item" data-id="${esc(d.id)}" data-label="${esc(d.label)}" data-pos="${esc(d.zip_code||'')}">${esc(d.label)}</button>`).join(''):'<p class="mut">Tidak ditemukan, coba kata kunci lain.</p>';
    }catch(err){$('#a_sugg').innerHTML=`<p class="mut">${esc(err.message)}</p>`}
  }
  $('#a_search').oninput=e=>{clearTimeout(searchDebounce);const q=e.target.value.trim();searchDebounce=setTimeout(()=>runSearch(q),400)};
  $('#a_sugg').onclick=e=>{
    const b=e.target.closest('[data-id]');if(!b)return;
    picked={id:b.dataset.id,label:b.dataset.label};
    if(b.dataset.pos)$('#a_pos').value=b.dataset.pos;
    $('#a_picked').hidden=false;$('#a_picked').textContent=b.dataset.label;
    $('#a_search').value='';$('#a_sugg').innerHTML='';
  };
  $('#geoBtn').onclick=()=>{
    if(!navigator.geolocation){$('#geoMsg').textContent='Perangkat/browser tidak mendukung deteksi lokasi.';return}
    $('#geoMsg').textContent='Mendeteksi lokasi…';
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const {latitude,longitude}=pos.coords;
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
        const d=await r.json();
        $('#a_detail').value=d.display_name||$('#a_detail').value;
        if(d.address?.postcode)$('#a_pos').value=d.address.postcode;
        const guess=d.address?.suburb||d.address?.village||d.address?.city_district||d.address?.town||'';
        $('#geoMsg').textContent=guess?'Lokasi terisi. Pilih wilayah yang cocok di hasil pencarian di bawah untuk hitung ongkir.':'Lokasi terisi otomatis. Cari dan pilih wilayah tujuan secara manual di bawah.';
        if(guess){$('#a_search').value=guess;runSearch(guess)}
      }catch{$('#geoMsg').textContent='Gagal mengambil detail lokasi. Isi alamat secara manual.'}
    },()=>{$('#geoMsg').textContent='Izin lokasi ditolak atau gagal. Isi alamat secara manual.'});
  };
  $('#af').onsubmit=e=>{
    e.preventDefault();
    if(!picked){toast('Pilih wilayah tujuan dari hasil pencarian dulu, supaya ongkir bisa dihitung otomatis.');return}
    addr={
      nama:$('#a_nama').value.trim(),telp:$('#a_telp').value.trim(),
      destId:picked.id,destLabel:picked.label,
      detail:$('#a_detail').value.trim(),pos:$('#a_pos').value.trim()
    };
    localStorage.setItem('addr_v1',JSON.stringify(addr));
    $('#addrDl').close();
    if(pendingItems){sendWa();}else{toast('Alamat tersimpan');renderCart()}
  };
}

/* ---------- checkout ---------- */
function startCheckout(items,isCart){
  if(!items.length){toast('Keranjang masih kosong');return}
  pendingItems=items;pendingIsCart=isCart;
  if(!addr){openAddress();}else{sendWa();}
}
function sendWa(){
  const items=pendingItems;if(!items){return}
  const lines=items.map((x,i)=>{const p=find(x.id);return `${i+1}. ${p?p.name:'Produk'} x${x.qty} = ${rp((p?p.price:0)*x.qty)}`});
  const ev=evaluateCart(items),subtotal=cartTotal(items),grand=Math.max(0,subtotal-ev.discount);
  const msg=[
    `Halo, saya mau checkout pesanan dari ${C.storeName}:`,'',
    ...lines,'',
    `Subtotal: ${rp(subtotal)}`,
    ...ev.applied.map(a=>`Promo: ${a.text}`),
    ev.freebies.length?`Bonus gratis: ${ev.freebies.map(f=>`${f.qty}x ${f.name}`).join(', ')}`:'',
    `Total${ev.discount>0?' setelah promo':''}: ${rp(grand)}`,
    `(Harga belum termasuk ongkos kirim)`,'',
    `Detail alamat pengiriman:`,
    `Nama: ${addr.nama}`,
    `No. WA: ${addr.telp}`,
    `Alamat: ${addr.detail}, ${addr.destLabel||''} ${addr.pos||''}`
  ].filter(Boolean).join('\n');
  let num=(C.checkoutWhatsapp||'').replace(/\D/g,'');if(num.startsWith('0'))num='62'+num.slice(1);
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`,'_blank');
  if(pendingIsCart){cart=[];appliedPromoIds=new Set();saveCart();updateFab()}
  pendingItems=null;
  $('#cartDl').close();
}

/* ---------- banner promosi ---------- */
let bannerTimer;
function renderBanners(){
  const valid=B.filter(b=>b.image&&(b.productIds||[]).some(id=>find(id)));
  $('#bannerWrap').hidden=valid.length===0;
  if(!valid.length)return;
  $('#bannerTrack').innerHTML=valid.map(b=>{
    const prs=[...new Map((b.productIds||[]).flatMap(id=>promosForProduct(id)).map(pr=>[pr.id,pr])).values()];
    const caption=prs.length?prs.map(promoLabel).join(' · '):'';
    return `<button type="button" class="banner-slide" data-ids="${esc(b.productIds.join(','))}">
      <img src="${esc(b.image)}" alt="Banner promosi" loading="lazy">
      ${caption?`<span class="banner-caption">${esc(caption)}</span>`:''}
    </button>`;
  }).join('');
  $('#bannerDots').innerHTML=valid.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('');
  const track=$('#bannerTrack');
  clearInterval(bannerTimer);
  if(valid.length>1)bannerTimer=setInterval(()=>{
    const w=track.clientWidth;
    const next=(Math.round(track.scrollLeft/w)+1)%valid.length;
    track.scrollTo({left:next*w,behavior:'smooth'});
  },4000);
  track.onscroll=()=>{
    const w=track.clientWidth||1;
    const idx=Math.round(track.scrollLeft/w);
    $('#bannerDots').querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===idx));
  };
  track.onclick=e=>{
    const slide=e.target.closest('.banner-slide');if(!slide)return;
    const ids=slide.dataset.ids.split(',').filter(Boolean);
    cat='';promoFilter={ids};draw();
    document.querySelector('.wrap').scrollIntoView({behavior:'smooth'});
  };
}

updateFab();
Promise.all([
  fetch(C.dataPath,{cache:'no-store'}).then(r=>r.json()).catch(()=>({products:[]})),
  fetch(C.bannerDataPath,{cache:'no-store'}).then(r=>r.json()).catch(()=>({banners:[]})),
  fetch(C.promoDataPath,{cache:'no-store'}).then(r=>r.json()).catch(()=>({promos:[]}))
]).then(([pd,bd,prd])=>{P=pd.products||[];B=bd.banners||[];PR=prd.promos||[];draw();renderBanners();appliedPromoIds=new Set(evaluateCart(cart).applied.map(a=>a.id))})
  .catch(()=>{$('#g').innerHTML='<p class="mut" style="grid-column:1/-1">Katalog belum bisa dimuat. Muat ulang halaman.</p>'});
</script></body></html>
